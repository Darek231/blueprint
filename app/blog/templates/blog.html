
{% extends "base.html" %}

{% block title %}
    Blog
{% endblock %}

{% block content %}
    {% if titulo %}
        <h1>{{ titulo }}</h1>
    {% else %}
        <h1>Bienvenido al Blog</h1>
        <p>Aquí encontrarás nuestras entradas.</p>

        <ul>
            <li><a href="{{ url_for('blog.mostrar_entrada', id=1) }}">Mi primera entrada</a></li>
            <li><a href="{{ url_for('blog.mostrar_entrada', id=2) }}">Aprendiendo Flask</a></li>
        </ul>
    {% endif %}
{% endblock %}
