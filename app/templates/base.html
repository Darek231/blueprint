
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mi aplicación Flask{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fc;
            color: #263248;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Encabezado */
        header {
            background: linear-gradient(135deg, #172554, #1e40af);
            color: white;
            padding: 25px 8%;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
        }

        header h1 {
            font-size: 27px;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }

        /* Navegación */
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            color: #e0eaff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #ffffff;
            color: #1e40af;
            transform: translateY(-2px);
        }

        /* Contenido principal */
        main {
            width: 84%;
            max-width: 1200px;
            margin: 40px auto;
            flex: 1;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.07);
            border: 1px solid #e7edf7;
        }

        main h1 {
            color: #1e3a8a;
            font-size: 30px;
            margin-bottom: 18px;
        }

        main h2 {
            color: #334155;
            margin: 25px 0 15px;
        }

        main p {
            line-height: 1.8;
            color: #64748b;
            margin-bottom: 15px;
        }

        main ul {
            padding-left: 25px;
            line-height: 2;
        }

        main a {
            color: #2563eb;
            text-decoration: none;
        }

        main a:hover {
            text-decoration: underline;
        }

        /* Pie de página */
        footer {
            background: #172554;
            color: #cbd5e1;
            text-align: center;
            padding: 22px;
            font-size: 14px;
            margin-top: auto;
        }

        /* Adaptación a celulares */
        @media (max-width: 600px) {
            header {
                padding: 22px 5%;
            }

            header h1 {
                font-size: 23px;
            }

            nav {
                gap: 5px;
            }

            nav a {
                padding: 9px 11px;
            }

            main {
                width: 92%;
                margin: 22px auto;
                padding: 22px;
            }

            main h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>✦ Mi aplicación Flask</h1>

        <nav>
            <a href="{{ url_for('admin.panel') }}">Administración</a>
            <a href="{{ url_for('blog.index') }}">Blog</a>
            <a href="{{ url_for('productos.lista_productos') }}">Productos</a>
            <a href="{{ url_for('auth.login') }}">Login</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Mi aplicación Flask · Desarrollado con Python y Flask</p>
    </footer>

</body>
</html>
